<!-- templates/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">🔐 Password Generator</h4>
                    </div>

                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label for="length" class="form-label">Password Length</label>
                                <input type="number" class="form-control" id="length" name="length" value="10" min="4" max="64">
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="letters" name="letters" checked>
                                <label class="form-check-label" for="letters">
                                    Include Letters (A–Z, a–z)
                                </label>
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="numbers" name="numbers" checked>
                                <label class="form-check-label" for="numbers">
                                    Include Numbers (0–9)
                                </label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="symbols" name="symbols">
                                <label class="form-check-label" for="symbols">
                                    Include Symbols (!@#$...)
                                </label>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Generate Password</button>
                        </form>
                    </div>

                    {% if password %}
                    <div class="card-footer bg-light">
                        <h5 class="mt-3">Generated Password:</h5>
                        <div class="input-group">
                            <input type="text" id="generatedPassword" class="form-control" value="{{ password }}" readonly>
                            <button class="btn btn-outline-secondary" onclick="copyToClipboard()">Copy</button>
                        </div>
                        <p class="mt-2"><strong>Entropy:</strong> {{ entropy }} bits</p>
                    </div>
                    {% endif %}
                </div>

            </div>
        </div>
    </div>

    <script>
        function copyToClipboard() {
            const input = document.getElementById("generatedPassword");
            input.select();
            input.setSelectionRange(0, 99999);
            document.execCommand("copy");
            alert("Password copied to clipboard!");
        }
    </script>

</body>
</html>
